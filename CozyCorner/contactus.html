<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CozyCorner | Contact us</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="page-contact">
    <div class="site-frame">
        <header class="site-header">
            <nav class="site-nav" aria-label="Main navigation">
                <a class="site-logo" href="index.html">Cozy Corner</a>
                <ul class="site-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="reservation.html">Reservations</a></li>
                    <li><a href="aboutus.html">About us</a></li>
                    <li><a class="is-active" href="contactus.html">Contact us</a></li>
                    <li><a href="login.html">Login/Register</a></li>
                </ul>
            </nav>
        </header>

        <main class="site-main">
            <section class="contact-layout" aria-label="Contact us content">
                <div class="placeholder-box placeholder-box--contact"></div>

                <section class="contact-panel">
                    <h1>Contact Us</h1>
                    <form class="contact-form" action="#">
                        <label for="contact-name">Name:</label>
                        <input id="contact-name" type="text" name="name">

                        <label for="contact-email">Email:</label>
                        <input id="contact-email" type="email" name="email">

                        <label for="contact-message">Message:</label>
                        <textarea id="contact-message" name="message"></textarea>

                        <button class="action-button action-button--small" type="submit">Submit</button>
                    </form>
                </section>
            </section>
        </main>

        <footer class="site-footer">
            <div class="footer-copy">Footer</div>
        </footer>
    </div>
    <script src="js/script.js"></script>
</body>
</html>
