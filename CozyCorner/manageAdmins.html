<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CozyCorner | Manage Admins</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="page-manage-admins">
    <div class="site-frame">
        <header class="site-header">
            <nav class="site-nav" aria-label="Super Admin navigation">
                <a class="site-logo" href="index.html">
                    <img src="img/logo.png" alt="CozyCorner">
                </a>
                <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="supermenu">
                    <span></span><span></span><span></span>
                    <span class="sr-only">Toggle navigation</span>
                </button>
                    <ul class="site-links" id="supermenu">
                        <li><a href="superadmin.html">Dashboard</a></li>
                        <li><a href="manageAdmins.html" class="is-active">Manage Admins</a></li>
                        
                        <li><a href="#" id="logout-link">Logout</a></li>
                </ul>
            </nav>
        </header>

        <main class="site-main">
            <div class="reservation-layout">
                <aside class="sidebar-panel">
                    <section class="panel" aria-labelledby="actions-title">
                        <div class="panel-heading">
                            <h2 id="actions-title">Manage</h2>
                        </div>
                        <div class="form-actions">
                            <button class="button button--primary" id="btn-add-admin">Add admin account</button>
                            <button class="button button--secondary" id="btn-update-admin">Update selected</button>
                            <button class="button button--danger" id="btn-disable-admin">Disable selected</button>
                        </div>
                    </section>
                </aside>

                <section class="panel" aria-labelledby="admins-list-title">
                    <div class="panel-heading">
                        <h2 id="admins-list-title">Admin Accounts</h2>
                    </div>
                    <div id="admins-container">
                        <p style="text-align:center; color:var(--text-soft); padding:40px;">Loading...</p>
                    </div>
                </section>
            </div>
        </main>

        <footer class="site-footer">
            <p>CozyCorner Super Admin – manage administrative accounts</p>
        </footer>
    </div>

    <!-- Admin edit/add modal -->
    <div id="admin-modal" class="modal" style="display:none;">
        <div class="modal-content panel">
            <div class="panel-heading">
                <h2 id="admin-modal-title">Add Admin Account</h2>
                <button class="modal-close" id="btn-close-admin-modal">&times;</button>
            </div>
            <form id="admin-form-modal" novalidate>
                <div class="field">
                    <label for="admin-username">Username</label>
                    <input id="admin-username" type="text" name="username" required>
                    <p class="field-message"></p>
                </div>
                <div class="field">
                    <label for="admin-email">Email</label>
                    <input id="admin-email" type="email" name="email" required>
                    <p class="field-message"></p>
                </div>
                <div class="field">
                    <label for="admin-password">Password (leave empty to keep unchanged)</label>
                    <input id="admin-password" type="password" name="password" minlength="6">
                    <p class="field-message"></p>
                </div>
                <div class="field">
                    <label for="admin-role">Role</label>
                    <select id="admin-role" name="role" required>
                        <option value="admin">Admin</option>
                        <option value="super_admin">Super Admin</option>
                    </select>
                    <p class="field-message"></p>
                </div>
                <button class="button button--primary" type="submit">Save</button>
            </form>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
