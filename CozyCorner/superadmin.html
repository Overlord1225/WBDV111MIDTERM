<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CozyCorner | Super Admin Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="page-superadmin">
    <div class="site-frame">
        <header class="site-header">
            <nav class="site-nav" aria-label="Super Admin navigation">
                <a class="site-logo" href="index.html">
                    <img src="img/logo.png" alt="CozyCorner">
                </a>
                <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="supermenu">
                    <span></span><span></span><span></span>
                    <span class="sr-only">Toggle navigation</span>
                </button>
                <ul class="site-links" id="supermenu">
                    <li><a href="superadmin.html" class="is-active">Dashboard</a></li>
                    <li><a href="manageAdmins.html">Manage Admins</a></li>
                    <li><a href="#" id="logout-link">Logout</a></li>
                </ul>
            </nav>
        </header>

        <main class="site-main">
            <h1 class="visually-hidden">Super Admin Dashboard</h1>

            <section class="stats-grid" aria-label="Overall statistics">
                <div class="stat-card">
                    <div class="stat-value" id="stat-total-reservations">0</div>
                    <div class="stat-label">Total reservations</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="stat-total-properties">0</div>
                    <div class="stat-label">Total properties</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="stat-total-guests">0</div>
                    <div class="stat-label">Total guests</div>
                </div>
            </section>

            <section class="panel" aria-labelledby="revenue-chart-title">
                <div class="panel-heading">
                    <h2 id="revenue-chart-title">Revenue chart</h2>
                </div>
                <div id="revenue-chart" style="min-height:200px;">
                    <p style="text-align:center;color:var(--text-soft);">Loading chart...</p>
                </div>
            </section>

            <section class="panel" aria-labelledby="recent-activity-title">
                <div class="panel-heading">
                    <h2 id="recent-activity-title">Recent activities</h2>
                </div>
                <div class="activity-log">
                    <ul class="activity-list" id="activity-log">
                        <li class="activity-item" style="text-align:center;color:var(--text-soft);">No recent activity.</li>
                    </ul>
                </div>
                <div style="margin-top: var(--space-md);">
                    <button class="button button--danger" id="btn-clear-activities">Clear all activities</button>
                </div>
            </section>
        </main>

        <footer class="site-footer">
            <p>CozyCorner Super Admin – full system overview</p>
        </footer>
    </div>
    <script src="js/script.js"></script>
</body>
</html>
