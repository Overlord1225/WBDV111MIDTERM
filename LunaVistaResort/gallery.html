<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luna Vista Resort | Gallery</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="home-page inner-page">
    <header class="site-header">
        <div class="brand">
            <img src="img/logo.png" alt="Luna Vista Resort logo" class="brand-logo">
            <span>Luna Vista Resort</span>
        </div>
        <nav class="site-nav">
            <a href="index.html">Home</a>
            <a href="gallery.html" aria-current="page">Gallery</a>
            <a href="reservation.html">Reservation</a>
            <a href="aboutus.html">About</a>
            <a href="contactus.html">Contact</a>
            <a href="login.html">Login</a>
        </nav>
    </header>

    <main class="page-main">
        <section class="page-hero">
            <p class="eyebrow">Discover Luna Vista</p>
            <h1>Gallery</h1>
            <p>Explore the rooms, leisure areas, and tropical scenes around the resort.</p>
        </section>

        <section class="content-panel">
            <div class="gallery-grid">
                <article class="room-card"><img src="img/room1.jpg" alt="Deluxe room interior"></article>
                <article class="room-card"><img src="img/room2.jpg" alt="Premier suite with warm lighting"></article>
                <article class="room-card"><img src="img/room3.jpg" alt="Guest room with balcony view"></article>
                <article class="room-card"><img src="img/room4.jpg" alt="Modern king room"></article>
                <article class="room-card"><img src="img/room5.jpg" alt="Family room setup"></article>
                <article class="room-card"><img src="img/room6.jpg" alt="Resort suite lounging space"></article>
                <article class="room-card"><img src="img/room7.jpg" alt="Elegant guest room"></article>
                <article class="room-card"><img src="img/room8.jpg" alt="Bedroom with accent lighting"></article>
                <article class="room-card"><img src="img/room9.jpg" alt="Premium room atmosphere"></article>
                <article class="room-card"><img src="img/room10.jpg" alt="Panoramic suite interior"></article>
            </div>
        </section>
    </main>

    <section class="gallery-lightbox" id="galleryLightbox" aria-hidden="true">
        <button class="lightbox-backdrop" id="lightboxBackdrop" type="button" aria-label="Close image preview"></button>
        <figure class="lightbox-content">
            <button class="lightbox-close" id="lightboxClose" type="button" aria-label="Close image preview">&times;</button>
            <img id="lightboxImage" src="" alt="">
            <figcaption id="lightboxCaption"></figcaption>
        </figure>
    </section>

    <footer class="site-footer">
        <p>&copy; 2026 Luna Vista Resort. All rights reserved.</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
