<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luna Vista Resort | Guest Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">
    <header class="site-header">
        <div class="brand">
            <img src="img/logo.png" alt="Luna Vista Resort logo" class="brand-logo">
            <span>Luna Vista Resort</span>
        </div>
        <nav class="site-nav">
            <a href="index.html">Home</a>
            <a href="gallery.html">Gallery</a>
            <a href="reservation.html">Reservation</a>
            <a href="aboutus.html">About</a>
            <a href="contactus.html">Contact</a>
            <a href="login.html" aria-current="page">Login</a>
        </nav>
    </header>

    <video class="bg-video" autoplay muted loop playsinline>
        <source src="vid/resortVID.mp4" type="video/mp4">
    </video>
    <div class="video-overlay" aria-hidden="true"></div>

    <main class="page">
        <section class="login-shell login-glass">
            <section class="form-panel">
                <p class="brand-chip">Luna Vista Resort</p>
                <p class="eyebrow">Welcome Back</p>
                <h2>Guest Login</h2>
                <p class="subtext">Enter your account details to continue.</p>

                <form id="loginForm" novalidate>
                    <label for="email">Email Address</label>
                    <input id="email" name="email" type="email" placeholder="you@example.com" required>

                    <label for="password">Password</label>
                    <input id="password" name="password" type="password" placeholder="Enter your password" required minlength="6">

                    <div class="form-row">
                        <label class="remember">
                            <input type="checkbox" id="remember">
                            Remember me
                        </label>
                        <a href="#" class="link">Forgot password?</a>
                    </div>

                    <button type="submit">Sign In</button>
                    <p id="formMessage" class="message" aria-live="polite"></p>
                </form>
            </section>
        </section>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 Luna Vista Resort. All rights reserved.</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
