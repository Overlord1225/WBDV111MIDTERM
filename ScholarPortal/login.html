<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8" />
   <meta name="viewport" content="width=device-width, initial-scale=1.0" />
   <title>ScholarPortal — Login</title>
   <link rel="stylesheet" href="css/style.css" />
</head>
<body class="page-login">
  <header class="site-header">
    <div class="header-content">
      <h1>ScholarPortal</h1>
      <p>Build your semester, settle fees, and track your academic record.</p>
    </div>
  </header>
  <main class="login-main">
    <div class="login-card">
      <h2>Sign In</h2>
      <p>Sign in to manage your semester modules and transcript.</p>

      <form action="index.html" method="post">
        <label for="studentID">Student ID</label>
        <input id="studentID" name="studentID" type="text" placeholder="Enter your student ID" required />

        <label for="password">Password</label>
        <input id="password" name="password" type="password" placeholder="Enter password" required />

        <button type="submit">Login</button>
      </form>
    </div>
  </main>
  <footer class="site-footer">
    <p>&copy; 2026 ScholarPortal. All rights reserved.</p>
  </footer>
</body>
</html>
