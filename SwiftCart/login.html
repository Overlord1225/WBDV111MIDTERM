<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SwiftCart Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="dashboard-page login-page">
    <main class="split-layout" aria-label="SwiftCart Login">
        <section class="marketing-panel" aria-label="SwiftCart Marketing">
            <div class="marketing-content">
                <p class="eyebrow">SwiftCart E-Commerce</p>
                <h1>Shop Fast. Track Smarter.</h1>
                <p>
                    Discover curated essentials, build your cart in seconds, and monitor
                    checkout status in one clean workflow.
                </p>
            </div>
        </section>

        <section class="login-panel" aria-label="Login Form">
            <form class="login-card" action="index.html" method="get">
                <p class="eyebrow">Welcome Back</p>
                <h2>Login to SwiftCart</h2>
                <p class="login-subtitle">Access your dashboard, cart, and order updates.</p>

                <label for="email">Email</label>
                <input id="email" name="email" type="email" placeholder="you@swiftcart.com" autocomplete="email" required>

                <label for="password">Password</label>
                <input id="password" name="password" type="password" placeholder="Enter password" autocomplete="current-password" required>

                <div class="login-actions">
                    <label class="checkbox-line" for="remember">
                        <input id="remember" type="checkbox" name="remember">
                        <span>Remember me</span>
                    </label>
                    <a href="#" class="text-link">Forgot password?</a>
                </div>

                <button type="submit" class="primary-btn">Login</button>

                <nav class="login-links" aria-label="Quick Links">
                    <a href="aboutus.html">About Us</a>
                    <a href="contact.html">Contact</a>
                </nav>
            </form>
        </section>
    </main>
</body>
</html>
