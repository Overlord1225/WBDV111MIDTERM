<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Music - VibeStreamingPro</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar">
    <div class="logo" aria-label="VibeStreaming Pro"><span class="logo-mark">VSP</span><span class="logo-text">VibeStreamingPro</span></div>
    <ul class="nav-links">
        <li><a href="login.html">Login</a></li>
        <li><a href="index.html">Explore</a></li>
        <li><a href="library.html">Library</a></li>
        <li><a href="playlist.html">Playlist</a></li>
        <li><a href="addmusic.html" class="active" aria-current="page">Add Music</a></li>
        <li><a href="profile.html">Profile</a></li>
    </ul>
</nav>

<div class="page-content">
    <h2>Add Music</h2>
    <p class="subtitle">Upload audio files here. Added songs will appear in your music pages.</p>

    <form id="musicUploadForm" class="upload-wrap">
        <p class="upload-title">Add Music File</p>
        <input type="file" id="musicFile" class="search-input" accept="audio/*" required>
        <input type="text" id="musicTitle" class="search-input" placeholder="Song title (optional)">
        <input type="text" id="musicArtist" class="search-input" placeholder="Artist (optional)">
        <button type="submit" class="upload-btn">Add Song</button>
        <p id="uploadStatus" class="upload-status"></p>
    </form>

    <div class="search-wrap">
        <input type="search" id="musicSearch" class="search-input" placeholder="Search uploaded songs..." aria-label="Search uploaded songs">
    </div>

    <div class="music-grid music-scroll" id="musicList"></div>
</div>

<script src="js/script.js"></script>
</body>
</html>
