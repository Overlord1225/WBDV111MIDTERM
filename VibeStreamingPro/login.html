<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>VibeStreamingPro - Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
    <div class="logo" aria-label="VibeStreaming Pro"><span class="logo-mark">VSP</span><span class="logo-text">VibeStreamingPro</span></div>
        <ul class="nav-links">
            <li><a href="login.html">Login</a></li>
            <li><a href="index.html">Explore</a></li>
            <li><a href="library.html">Library</a></li>
            <li><a href="playlist.html">Playlist</a></li>
            <li><a href="addmusic.html">Add Music</a></li>
            <li><a href="profile.html">Profile</a></li>
        </ul>
    </nav>
    <div class="login-container">
        <h2>VibeStreamingPro</h2>
        <p class="subtitle">Stream Your Vibes Anywhere</p>
        <form onsubmit="redirectToExplore(event)">
            <input type="email" placeholder="Email Address" required>
            <input type="password" placeholder="Password" required>    
            <button type="submit">Login</button>
        </form>
        <p class="extra">Don't have an account? <a href="#">Sign Up</a></p>
    </div>
    <script>
    function redirectToExplore(event) {
        event.preventDefault(); // prevents form from refreshing
        window.location.href = "explore.html";
    }
    </script>
</body>
</html>
